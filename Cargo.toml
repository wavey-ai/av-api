[package]
name = "av-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared audio ingest and orchestration helpers for Wavey API services"
repository = "https://github.com/wavey-ai/av-api"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
http = "1"
soundkit = { git = "https://github.com/wavey-ai/soundkit.git", package = "soundkit" }
soundkit-decoder = { git = "https://github.com/wavey-ai/soundkit.git", package = "soundkit-decoder" }
upload-response = { git = "https://github.com/wavey-ai/web-services.git", package = "upload-response" }

[dev-dependencies]
frame-header = "0.2.0"
http-pack = { git = "https://github.com/wavey-ai/http-pack.git", default-features = false }
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
