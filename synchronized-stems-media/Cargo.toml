[package]
name = "synchronized-stems-media"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Authoritative synchronized-stems config, SST1 datagrams and immutable epoch release"
repository = "https://github.com/wavey-ai/av-api"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
